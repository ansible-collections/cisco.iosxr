all:
  children:
    iosxr_cisshgo:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.iosxr.iosxr
        ansible_user: admin
        ansible_password: admin
        ansible_host: 127.0.0.1
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        ansible_become: false
      children:
        iosxr_interfaces_gathered:
          hosts:
            cisshgo-interfaces-gathered:
              ansible_port: 10000
        iosxr_interfaces_merged:
          hosts:
            cisshgo-interfaces-merged:
              ansible_port: 10001
        iosxr_interfaces_replaced:
          hosts:
            cisshgo-interfaces-replaced:
              ansible_port: 10002
        iosxr_interfaces_overridden:
          hosts:
            cisshgo-interfaces-overridden:
              ansible_port: 10003
        iosxr_interfaces_deleted:
          hosts:
            cisshgo-interfaces-deleted:
              ansible_port: 10004
