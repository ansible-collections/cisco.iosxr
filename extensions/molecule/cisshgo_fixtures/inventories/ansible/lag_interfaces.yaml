all:
  children:
    iosxr_cisshgo:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.iosxr.iosxr
        ansible_user: admin
        ansible_password: admin
        ansible_host: 127.0.0.1
        ansible_command_timeout: 200
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        ansible_network_cli_ssh_type: libssh
        ansible_libssh_hostkeys: +ssh-rsa
        ansible_become: false
      children:
        iosxr_lag_interfaces_gathered:
          hosts:
            cisshgo-lag_interfaces-gathered:
              ansible_port: 10000
        iosxr_lag_interfaces_merged:
          hosts:
            cisshgo-lag_interfaces-merged:
              ansible_port: 10001
        iosxr_lag_interfaces_replaced:
          hosts:
            cisshgo-lag_interfaces-replaced:
              ansible_port: 10002
        iosxr_lag_interfaces_overridden:
          hosts:
            cisshgo-lag_interfaces-overridden:
              ansible_port: 10003
        iosxr_lag_interfaces_deleted:
          hosts:
            cisshgo-lag_interfaces-deleted:
              ansible_port: 10004
