---
# https://redhat.atlassian.net/browse/AAP-93017
# state: merged with set: false on an option that is enabled on the device must
# emit the negation command and actually remove it, not re-send the enable form.
- ansible.builtin.debug:
    msg: Start iosxr_bgp_nbr_address_family merged set:false integration tests connection={{ ansible_connection}}

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _populate_base_config.yaml

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Disable enabled boolean options using set:false
      cisco.iosxr.iosxr_bgp_neighbor_address_family: &id001
        config:
          as_number: 65536
          neighbors:
            - neighbor_address: 192.0.2.2
              address_family:
                - afi: "ipv4"
                  safi: "unicast"
                  as_override:
                    set: false
                  send_community_ebgp:
                    set: false
                  send_extended_community_ebgp:
                    set: false
                  default_originate:
                    set: false
                  next_hop_self:
                    set: false
                  send_community_gshut_ebgp:
                    set: false
        state: merged
      register: result

    - name: Assert that negation commands were generated
      ansible.builtin.assert:
        that:
          - "{{ merged_set_false['commands'] | symmetric_difference(result['commands']) |length == 0 }}"

    - name: Assert that the options were actually removed from the device
      vars:
        af: "{{ result['after']['neighbors'][0]['address_family'][0] }}"
      ansible.builtin.assert:
        that:
          - result['changed'] == true
          - "'as_override' not in af"
          - "'send_community_ebgp' not in af"
          - "'send_extended_community_ebgp' not in af"
          - "'default_originate' not in af"
          - "'next_hop_self' not in af"
          - "'send_community_gshut_ebgp' not in af"

    - name: Assert that untouched options were left alone
      vars:
        af: "{{ result['after']['neighbors'][0]['address_family'][0] }}"
      ansible.builtin.assert:
        that:
          - af['multipath'] == true
          - af['weight'] == 5
          - af['capability_orf_prefix'] == 'both'
          - af['allowas_in']['value'] == 4
          - af['send_multicast_attributes']['set'] == true

    - name: Disable the same options again (idempotent)
      cisco.iosxr.iosxr_bgp_neighbor_address_family: *id001
      register: result

    - name: Assert that set:false against an already absent option is a no-op
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result.commands|length == 0
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
